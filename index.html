  <main class="screen" aria-label="Personal terminal of José Ramón Sahuquillo">

      <span class="dot"></span><span class="dot"></span><span class="dot g"></span>
      <span class="title">visitor@jrsahuquillo: ~</span>

      </span>
      <button type="button" class="rbt" id="reboot" title="Reboot">&#x21bb; reboot</button>
      <span class="title" id="clock">--:--</span>
    </div>

    <div class="term" id="term" tabindex="0"></div>

    <nav class="cmdbar" id="cmdbar" aria-label="Commands"></nav>

    <form class="inputline" id="form" autocomplete="off">
      <span class="prompt"><b>visitor@jrsahuquillo</b>:~$</span>
      <span class="inwrap">
        <input id="inp" type="text" aria-label="terminal input" autocapitalize="off" autocorrect="off" spellcheck="false">
        <span class="caret" id="caret" style="position:absolute;left:0;top:2px"></span>
